name: Clean install compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clean-install-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clean-install:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - name: Install dependencies without lifecycle scripts
        run: npm ci --include=optional --ignore-scripts
      - name: Install DesignWorkBench runner dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx playwright install --with-deps chromium
      - name: Install DesignWorkBench runner dependencies on macOS
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg
          npx playwright install chromium
      - name: Install DesignWorkBench runner dependencies on Windows
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg --yes --no-progress
          npx playwright install chromium
      - name: Typecheck package on the supported matrix
        run: npm run typecheck
      - name: Run the complete engine test suite on the supported matrix
        run: npm test -- --run
      - name: Enforce Trust Core coverage thresholds
        run: npm run test:trust-core:coverage
      - name: Build package from the checked-out source
        run: npm run build
      - name: Pack, install, and invoke the consumer binary
        run: npm run smoke:clean-install
      - name: Verify locked-mode behavior from the packed artifact
        run: npm run smoke:trust-core -- --portable
