name: Publish to MCP Registry

env:
  MCP_PUBLISHER_VERSION: v1.8.0
  MCP_PUBLISHER_LINUX_AMD64_SHA256: 1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify npm package is published
        run: |
          LOCAL_VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED_VERSION="$(npm view @memi-design/cli@"${LOCAL_VERSION}" version)"
          if [ "${PUBLISHED_VERSION}" != "${LOCAL_VERSION}" ]; then
            echo "::error::@memi-design/cli@${LOCAL_VERSION} is not available on npm"
            exit 1
          fi
          node -e "const p=require('./package.json'); const s=require('./server.json'); if (p.mcpName !== s.name) throw new Error('mcpName/server.json mismatch');"

      - name: Install mcp-publisher
        run: |
          ARCHIVE="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${ARCHIVE}" \
            --output "${ARCHIVE}"
          echo "${MCP_PUBLISHER_LINUX_AMD64_SHA256}  ${ARCHIVE}" | sha256sum --check --strict
          tar -xzf "${ARCHIVE}" mcp-publisher
          ./mcp-publisher --help

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish server.json
