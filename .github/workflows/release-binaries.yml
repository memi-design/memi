name: Build release binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing semver release tag to repair
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  release-gate:
    name: release gate
    runs-on: ubuntu-latest
    outputs:
      release_commit: ${{ steps.resolve-release.outputs.release_commit }}
      promote_channels: ${{ steps.resolve-release.outputs.promote_channels }}
      is_prerelease: ${{ steps.release-channel.outputs.is_prerelease }}
      github_make_latest: ${{ steps.release-channel.outputs.github_make_latest }}
      promote_stable_channels: ${{ steps.release-channel.outputs.promote_stable_channels }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEFAULT_BRANCH }}
          fetch-depth: 0

      - name: Resolve release channel
        id: release-channel
        run: node scripts/resolve-release-channel.mjs --tag "${RELEASE_TAG}" --github-output "${GITHUB_OUTPUT}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Resolve and verify requested release
        id: resolve-release
        shell: bash
        env:
          PROMOTE_STABLE_CHANNELS: ${{ steps.release-channel.outputs.promote_stable_channels }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          manifest_version="$(node -p "require('./release-manifest.json').releaseGroups.engine.version")"
          test "${RELEASE_TAG}" = "v${package_version}"
          test "${manifest_version}" = "${package_version}"
          resolved_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${RELEASE_TAG}^{commit}")"
          echo "release_commit=${resolved_commit}" >> "${GITHUB_OUTPUT}"
          promote_channels=false
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${PROMOTE_STABLE_CHANNELS}" = "true" ]; then
            git fetch origin "${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}" --force
            current_package_version="$(
              git show "origin/${DEFAULT_BRANCH}:package.json" |
                node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(input).version))'
            )"
            current_manifest_version="$(
              git show "origin/${DEFAULT_BRANCH}:release-manifest.json" |
                node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(input).releaseGroups.engine.version))'
            )"
            if [ "${RELEASE_TAG}" = "v${current_package_version}" ] &&
               [ "${current_manifest_version}" = "${current_package_version}" ] &&
               git merge-base --is-ancestor "${resolved_commit}" "origin/${DEFAULT_BRANCH}"; then
              promote_channels=true
            fi
          fi
          echo "promote_channels=${promote_channels}" >> "${GITHUB_OUTPUT}"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: npm-shrinkwrap.json

      - name: Install deps
        run: npm ci --include=optional --ignore-scripts

      - name: Check release metadata
        run: npm run check:release

  build:
    name: ${{ matrix.offlineTarget }}
    needs: release-gate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - binaryTarget: darwin-arm64
            offlineTarget: darwin-arm64
            runner: macos-14
            esbuildPackage: darwin-arm64
          - binaryTarget: darwin-x64
            offlineTarget: darwin-x64
            runner: macos-15-intel
            esbuildPackage: darwin-x64
          - binaryTarget: linux-arm64
            offlineTarget: linux-arm64
            runner: ubuntu-24.04-arm
            esbuildPackage: linux-arm64
          - binaryTarget: linux-x64
            offlineTarget: linux-x64
            runner: ubuntu-latest
            esbuildPackage: linux-x64
          - binaryTarget: win-x64
            offlineTarget: windows-x64
            runner: windows-latest
            esbuildPackage: win32-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-gate.outputs.release_commit }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: npm-shrinkwrap.json

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install deps
        run: npm ci --include=optional --ignore-scripts

      - name: Ensure platform esbuild binary
        shell: bash
        run: |
          ESBUILD_VERSION="$(node -p "require('./node_modules/vite/node_modules/esbuild/package.json').version")"
          npm install --no-save --package-lock=false --ignore-scripts "@esbuild/${{ matrix.esbuildPackage }}@${ESBUILD_VERSION}"

      - name: Restore exact repository bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config core.autocrlf false
          git archive --format=tar HEAD | tar --extract --file=-
          git diff --exit-code

      - name: Check release metadata
        shell: bash
        run: |
          restore_compatibility_files() {
            if [[ "${RUNNER_OS}" == "Windows" && "${RELEASE_TAG}" == "v2.6.3" ]]; then
              git archive --format=tar HEAD \
                docs/audits/memi-100-scorecard.md \
                scripts/check-release.mjs |
                tar --extract --file=-
              git diff --exit-code
            elif [[ "${RUNNER_OS}" == "Windows" && "${RELEASE_TAG}" == "v2.6.4" ]]; then
              git archive --format=tar HEAD scripts/check-release.mjs | tar --extract --file=-
              git diff --exit-code
            elif [[ "${RUNNER_OS}" == "Windows" && "${RELEASE_TAG}" == "v2.7.0" ]]; then
              git archive --format=tar HEAD scripts/validate-interface-benchmark.mjs | tar --extract --file=-
              git diff --exit-code
            fi
          }
          trap restore_compatibility_files EXIT
          if [[ "${RUNNER_OS}" == "Windows" && "${RELEASE_TAG}" == "v2.6.3" ]]; then
            node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const reportPath = "docs/audits/memi-100-scorecard.md";
          const releaseCheckPath = "scripts/check-release.mjs";
          const canonical = "Generated from `docs/audits/memi-100-scorecard.json`";
          const windows = "Generated from `docs\\audits\\memi-100-scorecard.json`";
          const report = await readFile(reportPath, "utf8");
          if (!report.includes(canonical) || report.includes(windows)) {
            throw new Error("v2.6.3 scorecard compatibility precondition failed");
          }
          await writeFile(reportPath, report.replace(canonical, windows), "utf8");
          const releaseCheck = await readFile(releaseCheckPath, "utf8");
          const npmAudit = 'const audit = spawnSync("npm", ["audit", "--omit=dev", "--audit-level=high", "--json"], {\n    cwd: root,';
          const windowsNpmAudit = 'const audit = spawnSync("npm", ["audit", "--omit=dev", "--audit-level=high", "--json"], {\n    shell: process.platform === "win32",\n    cwd: root,';
          if (!releaseCheck.includes(npmAudit) || releaseCheck.includes(windowsNpmAudit)) {
            throw new Error("v2.6.3 npm audit compatibility precondition failed");
          }
          await writeFile(
            releaseCheckPath,
            releaseCheck.replace(npmAudit, windowsNpmAudit),
            "utf8",
          );
          NODE
          fi
          if [[ "${RUNNER_OS}" == "Windows" && "${RELEASE_TAG}" == "v2.6.4" ]]; then
            node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const releaseCheckPath = "scripts/check-release.mjs";
          const releaseCheck = await readFile(releaseCheckPath, "utf8");
          const runtimeSchema = 'const runtimeSchema = spawnSync("npm", ["run", "check:runtime-schema"], {\n  cwd: root,';
          const windowsRuntimeSchema = 'const runtimeSchema = spawnSync("npm", ["run", "check:runtime-schema"], {\n  shell: process.platform === "win32",\n  cwd: root,';
          if (!releaseCheck.includes(runtimeSchema) || releaseCheck.includes(windowsRuntimeSchema)) {
            throw new Error("v2.6.4 runtime schema compatibility precondition failed");
          }
          await writeFile(
            releaseCheckPath,
            releaseCheck.replace(runtimeSchema, windowsRuntimeSchema),
            "utf8",
          );
          NODE
          fi
          if [[ "${RUNNER_OS}" == "Windows" && "${RELEASE_TAG}" == "v2.7.0" ]]; then
            node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const validatorPath = "scripts/validate-interface-benchmark.mjs";
          const validator = await readFile(validatorPath, "utf8");
          const oldImport = 'import path from "node:path";';
          const newImport = 'import path from "node:path";\nimport { fileURLToPath } from "node:url";';
          const oldRoot = 'const root = path.resolve(new URL("..", import.meta.url).pathname);';
          const newRoot = 'const root = path.resolve(fileURLToPath(new URL("..", import.meta.url)));';
          if (
            !validator.includes(oldImport) ||
            validator.includes(newImport) ||
            !validator.includes(oldRoot) ||
            validator.includes(newRoot)
          ) {
            throw new Error("v2.7.0 interface benchmark path compatibility precondition failed");
          }
          await writeFile(
            validatorPath,
            validator.replace(oldImport, newImport).replace(oldRoot, newRoot),
            "utf8",
          );
          NODE
          fi
          npm run check:release

      - name: Typecheck and build tsc output
        run: |
          npm run typecheck
          npm run build

      - name: Build binary
        run: node scripts/build-binary.mjs --target=${{ matrix.binaryTarget }}

      - name: Build deterministic offline bundle
        run: node scripts/build-offline-bundle.mjs --target=${{ matrix.offlineTarget }}

      - name: Smoke test
        shell: bash
        run: |
          cd dist-bin/memi-${{ matrix.binaryTarget }}
          if [ -f ./memi.exe ]; then
            ./memi.exe --version
          else
            ./memi --version
          fi

      - name: Attest offline bundle provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist-bin/memi-offline-*.tar.gz

      - name: Upload artifact to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ needs.release-gate.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.release-gate.outputs.github_make_latest }}
          files: |
            dist-bin/memi-${{ matrix.binaryTarget }}.tar.gz
            dist-bin/memi-${{ matrix.binaryTarget }}.zip
            dist-bin/memi-${{ matrix.binaryTarget }}.tar.gz.sha256
            dist-bin/memi-${{ matrix.binaryTarget }}.zip.sha256
            dist-bin/memi-offline-*.tar.gz
            dist-bin/memi-offline-*.tar.gz.sha256
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-checksums:
    needs: [release-gate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-gate.outputs.release_commit }}
          fetch-depth: 0
      - name: Download all release assets
        run: |
          mkdir -p sums
          gh release download "${RELEASE_TAG}" -R "${GITHUB_REPOSITORY}" \
            --pattern '*.sha256' --dir sums
          cat sums/*.sha256 > SHA256SUMS.txt
          cat SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload combined SHA256SUMS.txt
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ needs.release-gate.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.release-gate.outputs.github_make_latest }}
          files: SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-docker:
    needs: [release-gate, publish-checksums]
    if: needs.release-gate.outputs.promote_stable_channels == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-gate.outputs.release_commit }}
          fetch-depth: 0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable version
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.binary
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ env.RELEASE_TAG }}
          tags: ghcr.io/memi-design/memi:${{ env.RELEASE_TAG }}
      - name: Promote verified current release to latest
        if: needs.release-gate.outputs.promote_channels == 'true'
        run: |
          docker buildx imagetools create --tag ghcr.io/memi-design/memi:latest \
            "ghcr.io/memi-design/memi:${RELEASE_TAG}"

  publish-homebrew:
    needs: [release-gate, publish-checksums]
    if: needs.release-gate.outputs.promote_channels == 'true' && needs.release-gate.outputs.promote_stable_channels == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-gate.outputs.release_commit }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Download SHA256SUMS
        run: |
          mkdir -p dist-bin
          gh release download "${RELEASE_TAG}" -R "${GITHUB_REPOSITORY}" \
            --pattern 'SHA256SUMS.txt' --dir dist-bin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Render Homebrew formula
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          node scripts/homebrew/update-formula.mjs --version="${VERSION}" --out=memoire.rb
          test -s memoire.rb
          ruby -c memoire.rb
      - name: Push to tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN secret is required to publish the tap"
            exit 1
          fi
          git clone "https://x-access-token:${GH_TOKEN}@github.com/sarveshsea/homebrew-memi.git" tap
          mkdir -p tap/Formula
          cp memoire.rb tap/Formula/memoire.rb
          cd tap
          VERSION="${RELEASE_TAG#v}"
          grep -Fq "version \"${VERSION}\"" Formula/memoire.rb
          git config user.name "sarveshsea-bot"
          git config user.email "bot@memoire.cv"
          git add Formula/memoire.rb
          if ! git diff --cached --quiet; then
            git commit -m "memoire ${RELEASE_TAG}"
          fi
          git push
