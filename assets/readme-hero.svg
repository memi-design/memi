<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hero-surface" x1="86" y1="36" x2="1113" y2="613" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171820"/>
      <stop offset="1" stop-color="#0D0E13"/>
    </linearGradient>
    <linearGradient id="hero-accent" x1="149" y1="215" x2="502" y2="404" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF8EB5"/>
      <stop offset="1" stop-color="#D64578"/>
    </linearGradient>
    <linearGradient id="hero-rule" x1="664" y1="506" x2="1095" y2="506" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DE2B8" stop-opacity=".92"/>
      <stop offset="1" stop-color="#7DE2B8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="hero-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#FFFFFF" stroke-opacity=".035"/>
    </pattern>
    <pattern id="hero-dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#FF8EB5" fill-opacity=".22"/>
    </pattern>
    <filter id="hero-shadow" x="580" y="56" width="592" height="532" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000000" flood-opacity=".42"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="28" fill="url(#hero-surface)"/>
  <rect width="1200" height="630" rx="28" fill="url(#hero-grid)"/>
  <rect x="1" y="1" width="1198" height="628" rx="27" stroke="#FFFFFF" stroke-opacity=".09"/>
  <circle cx="1088" cy="93" r="139" fill="url(#hero-dots)"/>
  <circle cx="96" cy="551" r="129" fill="url(#hero-dots)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
    <rect x="72" y="72" width="252" height="34" rx="17" fill="#FFFFFF" fill-opacity=".075"/>
    <circle cx="92" cy="89" r="5" fill="#FF8EB5"/>
    <text x="106" y="95" fill="#D7D8E1" font-size="13" font-weight="700" letter-spacing="1.35">MEMI / DESIGN EVIDENCE</text>

    <text x="72" y="177" fill="#FFFFFF" font-size="50" font-weight="760" letter-spacing="-2.4">Give coding agents</text>
    <text x="72" y="235" fill="#FFFFFF" font-size="50" font-weight="760" letter-spacing="-2.4">an interface brief</text>
    <text x="72" y="293" fill="url(#hero-accent)" font-size="50" font-weight="760" letter-spacing="-2.4">before they write.</text>

    <text x="72" y="366" fill="#B8BAC7" font-size="18" font-weight="450">Read the codebase. Anchor the evidence. Verify the rerun.</text>
    <text x="72" y="394" fill="#858896" font-size="16" font-weight="450">A deterministic, read-only starting point for interface work.</text>

    <g transform="translate(72 476)">
      <rect width="122" height="40" rx="20" fill="#7DE2B8" fill-opacity=".12"/>
      <circle cx="20" cy="20" r="4" fill="#7DE2B8"/>
      <text x="33" y="25" fill="#CDF6E3" font-size="13" font-weight="750" letter-spacing=".45">READ ONLY</text>
      <rect x="134" width="126" height="40" rx="20" fill="#FFFFFF" fill-opacity=".065"/>
      <text x="156" y="25" fill="#E3E4EA" font-size="13" font-weight="750" letter-spacing=".45">NO API KEY</text>
      <rect x="272" width="112" height="40" rx="20" fill="#FFFFFF" fill-opacity=".065"/>
      <text x="293" y="25" fill="#E3E4EA" font-size="13" font-weight="750" letter-spacing=".45">CI READY</text>
    </g>
  </g>

  <g filter="url(#hero-shadow)">
    <rect x="604" y="77" width="516" height="476" rx="20" fill="#12131A"/>
    <rect x="604.5" y="77.5" width="515" height="475" rx="19.5" stroke="#FFFFFF" stroke-opacity=".12"/>
    <path d="M604 130H1120" stroke="#FFFFFF" stroke-opacity=".09"/>
    <circle cx="630" cy="104" r="5" fill="#FB7582"/>
    <circle cx="650" cy="104" r="5" fill="#F4C652"/>
    <circle cx="670" cy="104" r="5" fill="#74D69F"/>
    <text x="696" y="109" fill="#7F8290" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">interface-audit.json</text>

    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
      <text x="634" y="166" fill="#8F92A0" font-size="12" font-weight="700" letter-spacing="1.15">AUDIT FLOW</text>
      <text x="634" y="201" fill="#F4F5F8" font-size="25" font-weight="720" letter-spacing="-.7">Evidence before edits</text>

      <rect x="632" y="225" width="460" height="62" rx="12" fill="#FFFFFF" fill-opacity=".045"/>
      <rect x="648" y="241" width="26" height="26" rx="8" fill="#FF8EB5" fill-opacity=".16"/>
      <text x="657" y="259" fill="#FFAAC5" font-size="12" font-weight="800">01</text>
      <text x="692" y="251" fill="#F3F4F7" font-size="14" font-weight="700">Discover the interface</text>
      <text x="692" y="271" fill="#999CAA" font-size="13" font-weight="450">Routes, components, states, and tokens</text>

      <rect x="632" y="298" width="460" height="62" rx="12" fill="#FFFFFF" fill-opacity=".045"/>
      <rect x="648" y="314" width="26" height="26" rx="8" fill="#F4C652" fill-opacity=".16"/>
      <text x="657" y="332" fill="#F4D787" font-size="12" font-weight="800">02</text>
      <text x="692" y="324" fill="#F3F4F7" font-size="14" font-weight="700">Attach file-anchored findings</text>
      <text x="692" y="344" fill="#999CAA" font-size="13" font-weight="450">Confidence, provenance, and line evidence</text>

      <rect x="632" y="371" width="460" height="62" rx="12" fill="#7DE2B8" fill-opacity=".075"/>
      <rect x="648" y="387" width="26" height="26" rx="8" fill="#7DE2B8" fill-opacity=".16"/>
      <text x="657" y="405" fill="#A9EFD0" font-size="12" font-weight="800">03</text>
      <text x="692" y="397" fill="#F3F4F7" font-size="14" font-weight="700">Verify the same evidence</text>
      <text x="692" y="417" fill="#999CAA" font-size="13" font-weight="450">A deterministic rerun after a scoped fix</text>

      <path d="M634 462H1092" stroke="#FFFFFF" stroke-opacity=".09"/>
      <path d="M634 462H997" stroke="url(#hero-rule)" stroke-width="2"/>
      <text x="634" y="494" fill="#7DE2B8" font-size="12" font-weight="800" letter-spacing=".85">RECEIPTS</text>
      <text x="634" y="520" fill="#F2F3F6" font-size="19" font-weight="720">36 / 36 admitted</text>
      <text x="868" y="494" fill="#FF8EB5" font-size="12" font-weight="800" letter-spacing=".85">BOUNDARY</text>
      <text x="868" y="520" fill="#F2F3F6" font-size="15" font-weight="650">No universal claim</text>
    </g>
  </g>
</svg>
