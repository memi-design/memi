/* ── Card helpers ─────────────────────── */

.card-topline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  margin-bottom: 4px;
}

.card-title {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--fg);
}

.muted { color: var(--fg-secondary); font-size: 10px; }
.dim { color: var(--fg-dim); }
.mono { font-family: var(--mono); }
.stack { display: flex; flex-direction: column; gap: 2px; font-size: 10px; }

.kv-grid {
  display: grid;
  grid-template-columns: 72px 1fr;
  gap: 1px 10px;
  align-items: baseline;
  font-size: 10px;
}

.kv-key {
  font-family: var(--mono);
  color: var(--fg-dim);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  font-size: 9px;
  padding: 2px 0;
}

.kv-grid > span:nth-child(even) {
  color: var(--fg-secondary);
  padding: 2px 0;
  overflow: hidden;
  text-overflow: ellipsis;
}

.selection-preview {
  width: 100%;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-card);
  overflow: hidden;
}

.selection-preview img { display: block; width: 100%; height: auto; }

.chips { display: flex; flex-wrap: wrap; gap: 3px; }

.chip {
  font-family: var(--mono);
  display: inline-flex;
  padding: 1px 6px;
  border-radius: var(--radius);
  border: 1px solid var(--border-strong);
  background: var(--bg-card);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.4px;
  color: var(--fg-secondary);
  text-transform: uppercase;
}

/* ── Log cards ────────────────────────── */

.log-card { font-size: 10px; }
.log-card.success { border-left: 3px solid var(--green); }
.log-card.warn { border-left: 3px solid var(--yellow); }
.log-card.error { border-left: 3px solid var(--red); }
.log-card.info { border-left: 3px solid var(--fg-faint); }

.log-card pre {
  font-size: 9px;
  color: var(--fg-dim);
  margin-top: 3px;
  padding: 4px 6px;
  background: var(--bg-inset);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  max-height: 80px;
  overflow-y: auto;
}

/* ── Empty state ──────────────────────── */

.empty-card {
  text-align: center;
  padding: 20px 12px;
  background: transparent;
  border-style: dashed;
  border-color: var(--border-strong);
}

.empty-card .card-title { color: var(--fg-dim); font-size: 10px; margin-bottom: 2px; }
.empty-card .muted { font-size: 9px; color: var(--fg-faint); }

/* ── Inline actions ───────────────────── */

.split-grid { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: start; }
.inline-actions { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 6px; }
.inline-actions .tool-btn { padding: 3px 7px; font-size: 9px; }

.studio-companion {
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  background: var(--bg-card);
  padding: 10px;
}

.studio-companion-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 4px;
  margin: 8px 0;
}

.studio-companion-grid span {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-inset);
  color: var(--fg-secondary);
  padding: 4px 5px;
  font-size: 9px;
}

.studio-runtime {
  grid-column: 1 / -1;
  color: var(--accent) !important;
}

/* ── Activity ticker ──────────────────── */

.ticker {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  background: var(--bg-card);
  border-top: 1px solid var(--border);
  font-size: 10px;
  color: var(--fg-secondary);
  position: sticky;
  bottom: 0;
}

.ticker-dot {
  width: 5px;
  height: 5px;
  border-radius: 999px;
  background: var(--fg-faint);
  flex-shrink: 0;
}

.ticker.success .ticker-dot { background: var(--green); }
.ticker.warn .ticker-dot { background: var(--yellow); }
.ticker.error .ticker-dot { background: var(--red); }
.ticker.info .ticker-dot { background: var(--fg-dim); }

.ticker-text {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.ticker-time {
  color: var(--fg-faint);
  font-size: 9px;
  flex-shrink: 0;
}

/* ── Scrollbar ────────────────────────── */

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--fg-faint); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: var(--fg-dim); }

@media (max-width: 480px) {
  .jobs-summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .split-grid { grid-template-columns: 1fr; }
}

</style>
</head>
